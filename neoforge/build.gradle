// NeoForge 平台构建脚本 - 负责 NeoForge 平台的依赖装配、阴影打包与重映射
plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

loom {
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = "mmdskin-neoforge-refmap.json"
	}
	runs {
		client {
			client()
			name "NeoForge Client"
			runDir "run/client"
			programArgs "--username", "Developer"
		}
		server {
			server()
			name "NeoForge Server"
			runDir "run/server"
			programArgs "--nogui"
		}
	}
}

configurations {
	common
	shadowCommon
	shadowBundle
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
	modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
	modApi "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

	common("javazoom:jlayer:1.0.1") { transitive = false }
	shadowBundle("javazoom:jlayer:1.0.1") { transitive = false }
}

processResources {
	def replaceProperties = [
		minecraft_version: rootProject.minecraft_version,
		minecraft_version_range: '[1.21.1,1.22)',
		neoforge_version: rootProject.neoforge_version,
		neoforge_version_range: '[21.1.240,)',
		loader_version_range: '[4,)',
		mod_id: rootProject.mod_id,
		mod_name: rootProject.mod_name,
		mod_version: rootProject.mod_version,
		mod_authors: rootProject.mod_authors,
		mod_description: rootProject.mod_description
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand replaceProperties
	}
}

shadowJar {
	exclude "architectury.common.json"
	exclude "fabric.mod.json"
	configurations = [project.configurations.shadowCommon, project.configurations.shadowBundle]
	archiveClassifier.set("dev-shadow")
	relocate "javazoom", "com.shiroha.mmdskin.shadow.javazoom"

	// 排除不需要的文件
	exclude 'META-INF/versions/**'
	exclude 'module-info.class'

	mergeServiceFiles()
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

jar {
	archiveClassifier.set("dev")
	manifest {
		attributes([
			'Specification-Title'     : 'MMD Skin NeoForge',
			'Specification-Vendor'    : 'shiroha233',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'shiroha233',
			'MixinConfigs'            : 'mmdskin-neoforge.mixins.json'
		])
	}
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	exclude 'META-INF/neoforge.mods.toml'
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

sourceSets {
	main {
		resources {
			exclude 'assets/mmdskin/lang/*.json'
		}
	}
}
