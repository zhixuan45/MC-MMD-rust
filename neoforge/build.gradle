// NeoForge 平台构建脚本 - 使用官方 ModDevGradle 插件装配与打包
plugins {
	id 'net.neoforged.moddev'
	id 'com.gradleup.shadow'
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
			gameDirectory = file("run/client")
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
			programArguments.addAll '--username', 'Developer'
		}
		server {
			server()
			gameDirectory = file("run/server")
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
			programArgument '--nogui'
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet project.sourceSets.main
			sourceSet project(':common').sourceSets.main
		}
	}
}

configurations {
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	// 保持开发运行与发布包使用同一份 Mojmap 输出。
	implementation project(':common').sourceSets.main.output

	// Cloth Config API
	implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

	// MP3 解码依赖私有化重定位
	implementation("javazoom:jlayer:1.0.1") { transitive = false }
	additionalRuntimeClasspath("javazoom:jlayer:1.0.1") { transitive = false }
	shadowBundle("javazoom:jlayer:1.0.1") { transitive = false }

	// 仅供 NeoForge 开发运行环境加载，便于调试女仆兼容
	runtimeOnly "maven.modrinth:R0bDWFAW:tXG1TkGx"
}

processResources {
	def replaceProperties = [
		minecraft_version: rootProject.minecraft_version,
		minecraft_version_range: '[1.21.1,1.22)',
		neoforge_version: rootProject.neoforge_version,
		neoforge_version_range: '[21.1.240,)',
		loader_version_range: '[4,)',
		mod_id: rootProject.mod_id,
		mod_name: rootProject.mod_name,
		mod_version: rootProject.mod_version,
		mod_authors: rootProject.mod_authors,
		mod_description: rootProject.mod_description
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand replaceProperties
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	from project(':common').sourceSets.main.output
	relocate "javazoom", "com.shiroha.mmdskin.shadow.javazoom"
	archiveClassifier.set("")

	exclude 'META-INF/versions/**'
	exclude 'module-info.class'
	exclude 'fabric.mod.json'

	mergeServiceFiles()

	manifest {
		attributes([
			'Specification-Title'     : 'MMD Skin NeoForge',
			'Specification-Vendor'    : 'shiroha233',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'shiroha233',
			'MixinConfigs'            : 'mmdskin-neoforge.mixins.json'
		])
	}
}

jar {
	archiveClassifier.set("dev")
}

tasks.named("assemble").configure {
	dependsOn tasks.named("shadowJar")
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	exclude 'META-INF/neoforge.mods.toml'
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}
