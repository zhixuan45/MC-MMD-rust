// Fabric 平台构建脚本 - 负责 Fabric 平台的依赖装配、阴影打包与重映射
plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = "mmdskin-fabric-refmap.json"
	}
	runs {
		client {
			client()
			name "Fabric Client"
			runDir "run/client"
			programArgs "--username", "Developer"
		}
		server {
			server()
			name "Fabric Server"
			runDir "run/server"
			programArgs "--nogui"
		}
	}
}

configurations {
	common
	shadowCommon
	shadowBundle
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	// Fabric 核心平台与 API
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

	// Architectury API
	modImplementation("dev.architectury:architectury-fabric:${rootProject.architectury_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	// Cloth Config API
	modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	// ModMenu 编译期支持（可选运行）
	modCompileOnly "com.terraformersmc:modmenu:11.0.1"

	// Common 模块依赖与阴影打包
	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

	// MP3 解码依赖私有化重定位
	common("javazoom:jlayer:1.0.1") { transitive = false }
	shadowBundle("javazoom:jlayer:1.0.1") { transitive = false }
}

processResources {
	def replaceProperties = [
		minecraft_version: rootProject.minecraft_version,
		mod_id: rootProject.mod_id,
		mod_name: rootProject.mod_name,
		mod_version: rootProject.mod_version,
		mod_authors: rootProject.mod_authors,
		mod_description: rootProject.mod_description
	]

	inputs.properties replaceProperties

	filesMatching("fabric.mod.json") {
		expand replaceProperties
	}
}

shadowJar {
	exclude "architectury.common.json"
	configurations = [project.configurations.shadowCommon, project.configurations.shadowBundle]
	archiveClassifier.set("dev-shadow")
	relocate "javazoom", "com.shiroha.mmdskin.shadow.javazoom"

	exclude 'META-INF/versions/**'
	exclude 'module-info.class'

	mergeServiceFiles()
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

jar {
	archiveClassifier.set("dev")
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def commonSources = project(':common').sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

sourceSets {
	main {
		resources {
			exclude 'assets/mmdskin/lang/*.json'
		}
	}
}
