// 根项目构建脚本 - 多模块多平台协调与公共编译配置
plugins {
	id 'architectury-plugin' version "${architectury_plugin_version}"
	id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
	id 'com.gradleup.shadow' version "${shadow_version}" apply false
}

architectury {
	minecraft = project.minecraft_version
}

// 原生 JNI 动态链接库本地构建逻辑
def nativeResourcesDir = layout.buildDirectory.dir("generated/native-resources")
def bullet3Dir = file("rust_engine/deps/bullet3")
def bullet3Commit = "63c4d67e337017f9d8b298c900e9aabdb69296e7"
def bullet3Repository = "https://github.com/bulletphysics/bullet3.git"

def currentOs = System.getProperty("os.name").toLowerCase()
def currentArch = System.getProperty("os.arch").toLowerCase()
def isWindows = currentOs.contains("windows")
def isMacOS = currentOs.contains("mac")
def isLinux = currentOs.contains("linux")
def isArm64 = currentArch.contains("aarch64") || currentArch.contains("arm64")
def isLoongArch64 = currentArch.contains("loongarch64") || currentArch.contains("loong64")
def isRiscv64 = currentArch.contains("riscv64")

def nativeOutputDir = isWindows ? (isArm64 ? "windows-arm64" : "windows-x64") :
                     isMacOS ? (isArm64 ? "macos-arm64" : "macos-x64") :
                     isLinux ? (isArm64 ? "linux-arm64" : (isLoongArch64 ? "linux-loongarch64" : (isRiscv64 ? "linux-riscv64" : "linux-x64"))) : null

def nativeOutputFile = isWindows ? file("rust_engine/target/release/mmd_engine.dll") :
                      isMacOS ? file("rust_engine/target/release/libmmd_engine.dylib") :
                      isLinux ? file("rust_engine/target/release/libmmd_engine.so") : null

def cargoExecutable = {
	def cargoEnv = System.getenv("CARGO")
	if (cargoEnv != null && !cargoEnv.isBlank()) {
		return cargoEnv
	}
	def cargoHome = new File(System.getProperty("user.home"), ".cargo/bin")
	if (isWindows) {
		def windowsCargo = new File(cargoHome, "cargo.exe")
		if (windowsCargo.exists()) {
			return windowsCargo.absolutePath
		}
	} else {
		def unixCargo = new File(cargoHome, "cargo")
		if (unixCargo.exists()) {
			return unixCargo.absolutePath
		}
	}
	return "cargo"
}

def isBullet3Ready = {
	if (!new File(bullet3Dir, "src/LinearMath").isDirectory()) {
		return false
	}
	def output = new ByteArrayOutputStream()
	def result = project.exec {
		commandLine "git", "-C", bullet3Dir.absolutePath, "rev-parse", "HEAD"
		standardOutput = output
		errorOutput = new ByteArrayOutputStream()
		ignoreExitValue = true
	}
	return result.exitValue == 0 && output.toString().trim() == bullet3Commit
}

tasks.register("prepareBullet3Sources") {
	group = "build"
	description = "拉取 Rust 构建所需的固定版本 Bullet3 源码"
	doLast {
		if (isBullet3Ready()) {
			return
		}
		if (bullet3Dir.exists()) {
			throw new GradleException(
				"Bullet3 source at ${bullet3Dir} is not commit ${bullet3Commit}. " +
				"Remove this ignored directory and run the build again."
			)
		}
		project.exec {
			commandLine "git", "clone", "--no-checkout", bullet3Repository, bullet3Dir.absolutePath
		}
		project.exec {
			workingDir bullet3Dir
			commandLine "git", "checkout", "--detach", bullet3Commit
		}
	}
}

tasks.register("buildRustNative", Exec) {
	group = "build"
	description = "编译当前主机的 Release 版本 Rust 原生库"
	dependsOn tasks.named("prepareBullet3Sources")
	workingDir projectDir
	commandLine cargoExecutable(), "build", "--release", "--manifest-path", "rust_engine/Cargo.toml"
}

tasks.register("prepareNativeResources", Copy) {
	group = "build"
	description = "将当前编译的原生库复制到构建资源目录"
	if (nativeOutputFile != null && nativeOutputFile.exists() && nativeOutputDir != null) {
		from(nativeOutputFile)
		into(nativeResourcesDir.map { it.dir("natives/${nativeOutputDir}") })
	} else {
		// 如果本地尚未编译，则尝试触发编译；如果无 cargo 环境则略过
		dependsOn tasks.named("buildRustNative")
		from(nativeOutputFile)
		into(nativeResourcesDir.map { it.dir("natives/${nativeOutputDir}") })
	}
}

allprojects {
	apply plugin: 'java'
	apply plugin: 'architectury-plugin'

	group = rootProject.maven_group
	version = rootProject.mod_version

	repositories {
		mavenCentral()
		maven {
			name = 'Shedaniel'
			url = 'https://maven.shedaniel.me/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		maven {
			name = 'TerraformersMC'
			url = 'https://maven.terraformersmc.com/releases/'
		}
		maven {
			name = 'CurseMaven'
			url = 'https://cursemaven.com'
		}
		maven {
			name = 'Modrinth'
			url = 'https://api.modrinth.com/maven'
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 21
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
		withSourcesJar()
	}
}

subprojects {
	apply plugin: 'dev.architectury.loom'

	base {
		archivesName = "${rootProject.mod_id}-${project.name}"
	}

	loom {
		silentMojangMappingsLicense()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings loom.officialMojangMappings()
	}
}
