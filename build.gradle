plugins {
	id 'com.gradleup.shadow' version "${shadow_version}" apply false
	id 'fabric-loom' version "${fabric_loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

// 原生 JNI 动态链接库本地构建逻辑
def nativeResourcesDir = layout.buildDirectory.dir("generated/native-resources")
// CI 使用同次工作流编译的多平台原生库，本地仍交给 Cargo 增量构建。
def stagedNativePath = providers.gradleProperty("nativeResourcesPath").orNull
def stagedNativeDir = stagedNativePath == null ? null : file(stagedNativePath)
def bullet3Dir = file("rust_engine/deps/bullet3")
def bullet3Commit = "63c4d67e337017f9d8b298c900e9aabdb69296e7"
def bullet3Repository = "https://github.com/bulletphysics/bullet3.git"

def currentOs = System.getProperty("os.name").toLowerCase()
def currentArch = System.getProperty("os.arch").toLowerCase()
def isWindows = currentOs.contains("windows")
def isMacOS = currentOs.contains("mac")
def isLinux = currentOs.contains("linux")
def isArm64 = currentArch.contains("aarch64") || currentArch.contains("arm64")
def isLoongArch64 = currentArch.contains("loongarch64") || currentArch.contains("loong64")
def isRiscv64 = currentArch.contains("riscv64")

def nativeOutputDir = isWindows ? (isArm64 ? "windows-arm64" : "windows-x64") :
                     isMacOS ? (isArm64 ? "macos-arm64" : "macos-x64") :
                     isLinux ? (isArm64 ? "linux-arm64" : (isLoongArch64 ? "linux-loongarch64" : (isRiscv64 ? "linux-riscv64" : "linux-x64"))) : null

def nativeOutputFile = isWindows ? file("rust_engine/target/release/mmd_engine.dll") :
                      isMacOS ? file("rust_engine/target/release/libmmd_engine.dylib") :
                      isLinux ? file("rust_engine/target/release/libmmd_engine.so") : null

def cargoExecutable = {
	def cargoEnv = System.getenv("CARGO")
	if (cargoEnv != null && !cargoEnv.isBlank()) {
		return cargoEnv
	}
	def cargoHome = new File(System.getProperty("user.home"), ".cargo/bin")
	if (isWindows) {
		def windowsCargo = new File(cargoHome, "cargo.exe")
		if (windowsCargo.exists()) {
			return windowsCargo.absolutePath
		}
	} else {
		def unixCargo = new File(cargoHome, "cargo")
		if (unixCargo.exists()) {
			return unixCargo.absolutePath
		}
	}
	return "cargo"
}

def isBullet3Ready = {
	if (!new File(bullet3Dir, "src/LinearMath").isDirectory()) {
		return false
	}
	def output = new ByteArrayOutputStream()
	def result = project.exec {
		commandLine "git", "-C", bullet3Dir.absolutePath, "rev-parse", "HEAD"
		standardOutput = output
		errorOutput = new ByteArrayOutputStream()
		ignoreExitValue = true
	}
	return result.exitValue == 0 && output.toString().trim() == bullet3Commit
}

tasks.register("prepareBullet3Sources") {
	group = "build"
	description = "拉取 Rust 构建所需的固定版本 Bullet3 源码"
	doLast {
		if (isBullet3Ready()) {
			return
		}
		if (bullet3Dir.exists()) {
			throw new GradleException(
				"Bullet3 source at ${bullet3Dir} is not commit ${bullet3Commit}. " +
				"Remove this ignored directory and run the build again."
			)
		}
		project.exec {
			commandLine "git", "clone", "--no-checkout", bullet3Repository, bullet3Dir.absolutePath
		}
		project.exec {
			workingDir bullet3Dir
			commandLine "git", "checkout", "--detach", bullet3Commit
		}
	}
}

tasks.register("buildRustNative", Exec) {
	group = "build"
	description = "编译当前主机的 Release 版本 Rust 原生库"
	dependsOn tasks.named("prepareBullet3Sources")
	workingDir projectDir
	commandLine cargoExecutable(), "build", "--release", "--lib", "--manifest-path", "rust_engine/Cargo.toml"
}

tasks.register("validateNativeResources") {
	if (stagedNativeDir == null) {
		dependsOn tasks.named("buildRustNative")
	}
	doLast {
		if (stagedNativeDir != null) {
			def outputPath = nativeResourcesDir.get().asFile.canonicalPath
			def sourcePath = stagedNativeDir.canonicalPath
			if (stagedNativePath.isBlank() || sourcePath == outputPath || sourcePath.startsWith(outputPath + File.separator)) {
				throw new GradleException("nativeResourcesPath must be a separate staging directory")
			}
			def nativeFiles = fileTree(stagedNativeDir) {
				include 'natives/**/*.dll', 'natives/**/*.so', 'natives/**/*.dylib'
			}.files
			if (nativeFiles.isEmpty() || nativeFiles.any { it.length() == 0 }) {
				throw new GradleException("nativeResourcesPath contains no valid native libraries: ${stagedNativeDir}")
			}
		} else if (nativeOutputFile == null || nativeOutputDir == null || !nativeOutputFile.isFile() || nativeOutputFile.length() == 0) {
			throw new GradleException("No native library was built for ${currentOs}/${currentArch}")
		}
	}
}

tasks.register("prepareNativeResources", Sync) {
	group = "build"
	description = "同步本地或 CI 原生库到构建资源目录"
	dependsOn tasks.named("validateNativeResources")
	into(nativeResourcesDir)
	if (stagedNativeDir != null) {
		from(stagedNativeDir) {
			include 'natives/**'
		}
	} else {
		from({ nativeOutputFile }) {
			into("natives/${nativeOutputDir}")
		}
	}
}

allprojects {
	apply plugin: 'java'

	group = rootProject.maven_group
	version = rootProject.mod_version

	repositories {
		mavenCentral()
		maven {
			name = 'Shedaniel'
			url = 'https://maven.shedaniel.me/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'TerraformersMC'
			url = 'https://maven.terraformersmc.com/releases/'
		}
		maven {
			name = 'CurseMaven'
			url = 'https://cursemaven.com'
		}
		maven {
			name = 'Modrinth'
			url = 'https://api.modrinth.com/maven'
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 21
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
		withSourcesJar()
	}
}

subprojects {
	base {
		archivesName = "${rootProject.mod_id}-${project.name}"
	}
}


// 将完整许可随 Fabric / Forge / NeoForge 发布物一并打包。
subprojects {
    if (project.name != "common") {
        tasks.withType(ProcessResources).configureEach {
            from(rootProject.projectDir) {
                include "LICENSE", "LICENSE-*", "NOTICE", "THIRD_PARTY_LICENSES.md"
                into "META-INF/licenses/mmdskin"
            }
        }
    }
}
