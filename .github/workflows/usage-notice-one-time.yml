name: One-time usage notice verification and merged branch cleanup

on:
  push:
    branches: ['archived/1.20-vr']
    paths: ['.github/workflows/usage-notice-one-time.yml']

permissions:
  contents: read

jobs:
  java-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.21.1'
            ref: 'b197a171fe3db95540ffaaf75167c9d6e3ab08ba'
            java: '21'
            platform: 'neoforge'
            exclude: ':prepareNativeResources'
          - version: '1.20.1'
            ref: 'ad8883c6ed3b8f403664c657630119326f700cc8'
            java: '17'
            platform: 'forge'
            exclude: ':common:prepareNativeResources'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile both loaders and test confirmation persistence
        run: bash gradlew :common:test --tests com.shiroha.mmdskin.ui.config.UsageNoticeConfigTest :fabric:compileJava :${{ matrix.platform }}:compileJava -x ${{ matrix.exclude }} --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usage-notice-tests-${{ matrix.version }}
          path: common/build/reports/tests/test/
          if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const candidates = [{"branch":"codex/backport-1.21-features-to-1.20","sha":"48f362e5ac640bb2a353a1b8515744e61c9c52cb","base":"archived/1.20-vr"},{"branch":"codex/fix-body-collider-fill","sha":"6bfba47ab357a3eca410f02a01448c7ce9967a7a","base":"feat/1.21.1-neoforge"},{"branch":"codex/fix-material-render-state-1.21","sha":"64bc53c73282b26e2ae52cf4712d4b3978d51232","base":"feat/1.21.1-neoforge"},{"branch":"codex/fix-static-uv-translucent-cache","sha":"6a643654d961330ba06cb6f94feb3d7c02122e1a","base":"feat/1.21.1-neoforge"},{"branch":"codex/sort-translucent-surfaces-1.21","sha":"24597586609989efe11b35b81e984619f2840dda","base":"feat/1.21.1-neoforge"},{"branch":"fix/1.21-preserve-authored-garment-joints-20261014","sha":"c24c62d551d0439e5d6a50e5f040a65602270225","base":"feat/1.21.1-neoforge"},{"branch":"refactor/native-multiloader","sha":"bbe72a2c524995a4df443f3e2f672c07a5ae3cbd","base":"feat/1.21.1-neoforge"}];
            for (const candidate of candidates) {
              let current;
              try {
                current = await github.rest.git.getRef({owner, repo, ref: 'heads/' + candidate.branch});
              } catch (error) {
                if (error.status === 404) { core.info('Already absent: ' + candidate.branch); continue; }
                throw error;
              }
              if (current.data.object.sha !== candidate.sha) {
                throw new Error('Branch changed; refusing deletion: ' + candidate.branch);
              }
              const base = await github.rest.git.getRef({owner, repo, ref: 'heads/' + candidate.base});
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: base.data.object.sha, head: candidate.sha
              });
              if (comparison.data.ahead_by !== 0 ||
                  !['behind', 'identical'].includes(comparison.data.status)) {
                throw new Error('Branch is not fully merged: ' + candidate.branch);
              }
              const latest = await github.rest.git.getRef({owner, repo, ref: 'heads/' + candidate.branch});
              if (latest.data.object.sha !== candidate.sha) {
                throw new Error('Branch changed during check: ' + candidate.branch);
              }
              await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + candidate.branch});
              core.info('Deleted merged branch: ' + candidate.branch);
            }
            
