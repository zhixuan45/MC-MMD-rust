gradle.projectsEvaluated {
    def common = gradle.rootProject.project(':common')
    def probeProcessors = gradle.rootProject.findProperty('transparencyProbeProcessors')
    if (probeProcessors != null) {
        def processors = Integer.parseInt(probeProcessors.toString())
        if (processors < 1) throw new GradleException('transparencyProbeProcessors must be positive')
        common.tasks.named('test') { jvmArgs "-XX:ActiveProcessorCount=${processors}" }
    }
    common.tasks.register('writeTranslucentProbeClasspath') {
        doLast {
            def output = new File(gradle.rootProject.projectDir, 'build/translucent-performance/classpath.txt')
            output.parentFile.mkdirs()
            output.text = common.sourceSets.main.runtimeClasspath.asPath
        }
    }
}
